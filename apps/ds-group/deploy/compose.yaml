name: ds-group

x-app: &app
  image: ${DS_GROUP_IMAGE:-ds-group:local}
  build:
    context: ..
    dockerfile: Dockerfile
  init: true

x-server-environment: &server-environment
  DS_GROUP_DATA_DIR: /data
  DS_GROUP_MATRIX_URL: http://synapse:8008
  DS_GROUP_SERVER_NAME: ${DS_GROUP_SERVER_NAME:-localhost}
  DS_GROUP_PUBLIC_URL: ${DS_GROUP_PUBLIC_URL:-http://localhost:18100}
  DS_GROUP_MATRIX_PUBLIC_URL: ${DS_GROUP_MATRIX_PUBLIC_URL:-http://localhost:18008}
  # People and Bots sign in with accounts on this central server. Point it at another one to share accounts.
  DS_GROUP_CENTRAL_URL: ${DS_GROUP_CENTRAL_URL:-http://localhost:18200}
  DS_GROUP_GOVERNANCE_DIR: /dscord-policy
  # Empty preserves the mode already saved by init; a fresh deployment defaults to bundled.
  DS_GROUP_WEB_MODE: ${DS_GROUP_WEB_MODE:-}

services:
  # Accounts and identity tokens only; it stores no messages or files. A deployment that uses an
  # existing central server can leave this service stopped and set DS_GROUP_CENTRAL_URL.
  central:
    <<: *app
    command: ["node", "central/service.mjs"]
    environment:
      DSCORD_CENTRAL_DATA_DIR: /central
      DSCORD_CENTRAL_HOST: 0.0.0.0
      DSCORD_CENTRAL_PORT: "18200"
      DSCORD_CENTRAL_ISSUER: ${DS_GROUP_CENTRAL_URL:-http://localhost:18200}
      DSCORD_CENTRAL_REGISTRATION: ${DSCORD_CENTRAL_REGISTRATION:-open}
      # New chat servers wait for an administrator's review unless this is "open". Administrators sign in at /admin.
      DSCORD_CENTRAL_LISTING: ${DSCORD_CENTRAL_LISTING:-review}
      DSCORD_CENTRAL_ADMINS: ${DSCORD_CENTRAL_ADMINS:-}
      DSCORD_CENTRAL_CLIENT_ORIGINS: ${DSCORD_CENTRAL_CLIENT_ORIGINS:-${DS_GROUP_PUBLIC_URL:-http://localhost:18100}}
      # The server index reads this chat server's public page through the Compose network.
      DSCORD_CENTRAL_SERVER_FETCH_URLS: ${DSCORD_CENTRAL_SERVER_FETCH_URLS:-${DS_GROUP_PUBLIC_URL:-http://localhost:18100}=http://core:18100}
    volumes:
      - central-data:/central
    ports:
      - "${DS_GROUP_BIND:-127.0.0.1}:${DS_GROUP_CENTRAL_PORT:-18200}:18200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18200/.well-known/dscord/central').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 15s

  config:
    <<: *app
    user: "0:0"
    command: ["node", "scripts/server-init.mjs"]
    environment:
      <<: *server-environment
      DS_GROUP_SYNAPSE_DIR: /synapse
    volumes:
      - core-data:/data
      - synapse-data:/synapse
      - governance-data:/dscord-policy
    restart: "no"

  synapse:
    image: ghcr.io/element-hq/synapse:v1.164.2@sha256:f0df87cff259872637b4b5e5174b9977e5e3046dd421505407803b5e45c5f842
    environment:
      UID: "1000"
      GID: "1000"
      PYTHONPATH: /data
    command: ["run", "-m", "synapse.app.homeserver", "--config-path=/data/homeserver.yaml", "--config-path=/data/governance.generated.yaml"]
    depends_on:
      config:
        condition: service_completed_successfully
    volumes:
      - synapse-data:/data
      - governance-data:/dscord-policy
    ports:
      - "${DS_GROUP_BIND:-127.0.0.1}:${DS_GROUP_MATRIX_PORT:-18008}:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
    restart: unless-stopped
    stop_grace_period: 30s

  bootstrap:
    <<: *app
    command: ["node", "scripts/server-bootstrap.mjs"]
    environment:
      <<: *server-environment
      DS_GROUP_BOOTSTRAP_DEMO: ${DS_GROUP_BOOTSTRAP_DEMO:-false}
      # A profiles path is inside this container; mount the private file with an overlay.
      DS_GROUP_BOOTSTRAP_PROFILES_PATH: ${DS_GROUP_BOOTSTRAP_PROFILES_PATH:-}
    volumes:
      - core-data:/data
      - governance-data:/dscord-policy
    depends_on:
      synapse:
        condition: service_healthy
    restart: "no"

  core:
    <<: *app
    environment:
      <<: *server-environment
      DS_GROUP_HOST: 0.0.0.0
      DS_GROUP_PORT: "18100"
      DS_GROUP_CENTRAL_FETCH_URL: ${DS_GROUP_CENTRAL_FETCH_URL:-http://central:18200}
    volumes:
      - core-data:/data
      - governance-data:/dscord-policy
    ports:
      - "${DS_GROUP_BIND:-127.0.0.1}:${DS_GROUP_HTTP_PORT:-18100}:18100"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

  administration:
    <<: *app
    command: ["node", "src/admin.mjs"]
    environment:
      <<: *server-environment
      DS_GROUP_SYNAPSE_DIR: /synapse
      DS_GROUP_ADMIN_HOST: 0.0.0.0
      DS_GROUP_ADMIN_PORT: "18110"
      DS_GROUP_CENTRAL_FETCH_URL: ${DS_GROUP_CENTRAL_FETCH_URL:-http://central:18200}
    volumes:
      - core-data:/data
      - synapse-data:/synapse
      - governance-data:/dscord-policy
    ports:
      - "127.0.0.1:${DS_GROUP_ADMIN_PORT:-18110}:18110"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18110/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  central-data:
  core-data:
  synapse-data:
  governance-data:
