services:
  core:
    environment:
      DS_GROUP_TRUST_PROXY: "true"

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DS_GROUP_DOMAIN: ${DS_GROUP_DOMAIN:?Set DS_GROUP_DOMAIN to the public chat hostname}
      DS_GROUP_CENTRAL_DOMAIN: ${DS_GROUP_CENTRAL_DOMAIN:-id.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
