name: DS-Group CI

# Fast gate for every pull request and main: lint, format, types, unit tests and a production build.
# The deployment, DSH runtime and browser suites live in ds-group-full.yml (release tags and manual runs).
on:
  push:
    branches: [main]
    paths:
      - 'apps/ds-group/**'
      - '.github/workflows/ds-group-ci.yml'
  pull_request:
    paths:
      - 'apps/ds-group/**'
      - '.github/workflows/ds-group-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-group-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ds-group
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/ds-group/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax, lint, format, types and unit tests
        run: npm run check
      - name: Production build
        run: npm run build
