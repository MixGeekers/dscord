name: DS-Group Release

on:
  push:
    tags: ['ds-group-v*']

permissions:
  contents: read

concurrency:
  group: ds-group-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
      archive: ${{ steps.release.outputs.archive }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      npm_archive: ${{ steps.release.outputs.npmArchive }}
      npm_tag: ${{ steps.release.outputs.npmTag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - id: release
        name: Match release tag and package version
        run: node apps/ds-group/scripts/release-metadata.mjs

  verify:
    needs: metadata
    uses: ./.github/workflows/ds-group-full.yml
    permissions:
      contents: read

  image:
    name: Publish Linux ${{ matrix.arch }}
    needs: [metadata, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ds-group-source
          path: apps/ds-group/.local/release
      - name: Verify source payload
        run: node apps/ds-group/scripts/release-verify.mjs --require-public-content --extract apps/ds-group/.local/release-unpacked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Publish verified source as an image digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/ds-group/.local/release-unpacked
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=ds-group-${{ matrix.arch }}
      - name: Export immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish npm, image index and GitHub Release
    needs: [metadata, verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      NPM_ARCHIVE: ${{ needs.metadata.outputs.npm_archive }}
      NPM_TAG: ${{ needs.metadata.outputs.npm_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Use the pinned npm CLI with OIDC publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ds-group-source
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ds-group-npm
          path: release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-index
        name: Assemble or verify the immutable image index
        run: node apps/ds-group/scripts/release-image.mjs
      - name: Bind the updater and checksums to the published image
        shell: bash
        env:
          DS_GROUP_RELEASE_IMAGE_REF: ${{ steps.image-index.outputs.reference }}
        run: |
          node apps/ds-group/scripts/server-update-manifest.mjs release/server-update.json
          (cd release && sha256sum image-index.json >> SHA256SUMS)
          if [ -f release/server-update.json ]; then
            (cd release && sha256sum server-update.json >> SHA256SUMS)
          fi
          (cd release && cat NPM-SHA256SUMS >> SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Publish the tested npm tarball with OIDC and verify a clean registry installation
        run: node apps/ds-group/scripts/npm-publish.mjs
      - name: Publish or resume verified GitHub assets
        run: node apps/ds-group/scripts/github-release.mjs
